<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>會議室狀態</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=l1">
</head>
<body>

  <!-- ── Kiosk mode ── -->
  <div id="kiosk-view" class="hidden">
    <div class="kiosk-inner">
      <div class="kiosk-room-name" id="kiosk-room-name"></div>
      <div class="kiosk-status-block">
        <span class="kiosk-icon" id="kiosk-icon"></span>
        <span class="kiosk-status-text" id="kiosk-status-text"></span>
      </div>
      <div class="kiosk-booking-info" id="kiosk-booking-info"></div>
      <div class="kiosk-next" id="kiosk-next"></div>
      <div class="kiosk-clock" id="kiosk-clock"></div>
      <div class="kiosk-sync" id="kiosk-sync"></div>
    </div>
  </div>

  <!-- ── Normal app ── -->
  <div id="app">

    <header id="header">
      <div class="header-inner">
        <div class="header-brand">
          <div class="header-title-row">
            <span class="header-icon" aria-hidden="true">🏢</span>
            <h1>會議室狀態</h1>
          </div>
          <p class="header-sub">今天誰在開會，一眼看清楚</p>
        </div>
        <div class="header-right">
          <div id="live-clock" class="live-clock" aria-live="off"></div>
          <div id="sync-pill" class="sync-pill sync-syncing" aria-live="polite">
            <span class="sync-dot"></span>
            <span class="sync-label">連線中…</span>
          </div>
        </div>
      </div>
      <div class="shadow-warning" role="alert">
        ⚠ Shadow IT 系統 · 請勿填寫任何機密資訊
      </div>
      <!-- Backward-compat stubs -->
      <span id="date-line"   hidden aria-hidden="true"></span>
      <span id="status-line" hidden aria-hidden="true"></span>
      <button id="refresh-btn" hidden aria-hidden="true" tabindex="-1"></button>
    </header>
    <div id="room-tabs"   hidden aria-hidden="true"></div>
    <div id="room-panels" hidden aria-hidden="true"></div>

    <!-- View navigation -->
    <nav id="view-nav" role="tablist" aria-label="切換檢視">
      <button class="nav-btn active" role="tab" aria-selected="true"  data-view="dashboard">今日狀態</button>
      <button class="nav-btn"        role="tab" aria-selected="false" data-view="manage">管理預約</button>
      <button class="nav-btn"        role="tab" aria-selected="false" data-view="week">本週一覽</button>
    </nav>

    <!-- ── Dashboard view ── -->
    <div id="view-dashboard" class="view active">

      <div id="date-selector-bar" class="date-selector-bar">
        <div class="date-selector-row">
          <input type="date" id="date-input" class="date-input" aria-label="選擇日期">
          <button id="btn-today"    class="date-quick-btn">今天</button>
          <button id="btn-tomorrow" class="date-quick-btn">明天</button>
        </div>
        <div id="date-label" class="date-label" aria-live="polite"></div>
      </div>

      <section id="room-status-grid" aria-label="會議室狀態總覽"></section>

      <!-- ── Time ribbon (Layer 1, flag-gated) ── -->
      <section id="ribbon-section" class="ribbon-section hidden" aria-label="時段甘特圖">
        <h2 class="section-heading">時段甘特圖</h2>
        <div id="ribbon-wrapper" class="ribbon-wrapper">
          <div id="ribbon-body" class="ribbon-body">
            <!-- lanes + needle injected by JS -->
          </div>
          <div class="ribbon-axis" id="ribbon-axis"><!-- time ticks --></div>
        </div>
      </section>

      <section id="today-schedule-section">
        <h2 class="section-heading">今日時段表</h2>
        <div class="timeline-wrapper" id="timeline-wrapper">
          <div class="timeline-now-line hidden" id="now-line" aria-hidden="true">
            <span class="now-label"></span>
          </div>
          <table class="timeline-table" id="timeline-table">
            <thead id="timeline-head"></thead>
            <tbody id="timeline-body"></tbody>
          </table>
        </div>
      </section>

    </div>

    <!-- ── Manage view ── -->
    <div id="view-manage" class="view hidden">
      <div class="manage-header">
        <h2 class="section-heading">預約清單</h2>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button id="export-today-btn" class="btn btn-sm btn-secondary" title="匯出今日預約為 CSV">匯出今日 CSV</button>
          <button id="export-week-btn"  class="btn btn-sm btn-secondary" title="匯出本週預約為 CSV">匯出本週 CSV</button>
          <button id="manage-refresh-btn" class="icon-btn-sm" aria-label="重新整理">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </div>
      <div id="manage-list"></div>
    </div>

    <!-- ── This-week view ── -->
    <div id="view-week" class="view hidden">
      <div class="manage-header">
        <h2 class="section-heading">本週預約一覽</h2>
      </div>
      <div id="week-list"></div>
    </div>

  </div><!-- #app -->

  <!-- ── Booking Modal ── -->
  <div id="book-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="book-title">
    <div class="modal" role="document">
      <div class="modal-header">
        <div>
          <h2 id="book-title">預約時段</h2>
          <p id="book-slot-info" class="modal-sub"></p>
        </div>
        <button class="modal-close-btn" id="book-close-x" aria-label="關閉">✕</button>
      </div>
      <form id="book-form" novalidate autocomplete="off">

        <!-- Duration (required) -->
        <div class="field">
          <label for="f-duration">預約時長 <span class="req" aria-label="必填">*</span></label>
          <select id="f-duration" required>
            <option value="1h">1 小時</option>
            <option value="2h">2 小時</option>
            <option value="3h">3 小時</option>
            <option value="4h">4 小時</option>
            <option value="morning_half">上午半天（08:00–12:00）</option>
            <option value="afternoon_half">下午半天（13:00–18:00）</option>
            <option value="full_day">全天（08:00–18:00）</option>
          </select>
        </div>

        <!-- Name (required) — first name only; last initial if duplicate -->
        <div class="field">
          <label for="f-owner">姓名 <span class="req" aria-label="必填">*</span></label>
          <div class="input-row">
            <input id="f-owner" type="text" maxlength="30" autocomplete="given-name"
              placeholder="請輸入名字，例如 Steven；若重名請輸入 Alex C" required>
            <button type="button" id="clear-identity-btn" class="clear-btn" title="清除記住的資料">清除</button>
          </div>
          <span class="hint">名字即可；若有同名請加姓氏縮寫（如 Alex C）</span>
        </div>

        <!-- Department (required) -->
        <div class="field">
          <label for="f-dept">部門 <span class="req" aria-label="必填">*</span></label>
          <select id="f-dept" required>
            <option value="">請選擇部門</option>
          </select>
        </div>

        <!-- Project / Region (required) -->
        <div class="field">
          <label for="f-project">區域 / 專案 <span class="req" aria-label="必填">*</span></label>
          <input id="f-project" type="text" maxlength="40"
            placeholder="例如：北部客戶 / Q3 策略 / 內部討論" required>
          <span class="hint">請勿填寫機密專案名稱或敏感資訊</span>
        </div>

        <!-- Purpose / Category (required) -->
        <div class="field">
          <label for="f-title">事由 / 類型 <span class="req" aria-label="必填">*</span></label>
          <input id="f-title" type="text" maxlength="40" placeholder="週會 / 業務對接 / 客戶討論…" required>
        </div>

        <!-- People (optional) -->
        <div class="field">
          <label for="f-people">人數 <span class="optional">(選填)</span></label>
          <input id="f-people" type="number" min="1" max="100" placeholder="出席人數">
        </div>

        <!-- Notes (optional) -->
        <div class="field">
          <label for="f-notes">備註 <span class="optional">(選填)</span></label>
          <input id="f-notes" type="text" maxlength="100" placeholder="特殊需求 / 設備需求…">
          <span class="hint">請勿填寫機密或敏感資訊</span>
        </div>

        <!-- PIN (optional) -->
        <div class="field" id="pin-field">
          <label for="f-pin">取消 PIN <span class="optional">(選填，4 位數)</span></label>
          <input id="f-pin" type="tel" maxlength="4" pattern="[0-9]{4}"
            placeholder="留空則不設 PIN" inputmode="numeric">
          <span class="hint">僅防手滑誤刪，不防惡意操作</span>
        </div>

        <div class="modal-actions">
          <button type="button" id="book-cancel-btn" class="btn btn-ghost">取消</button>
          <button type="submit"  id="book-submit-btn" class="btn btn-primary">確認預約</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Detail / Cancel Modal ── -->
  <div id="detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal" role="document">
      <div class="modal-header">
        <h2 id="detail-title">預約詳情</h2>
        <button class="modal-close-btn" id="detail-close-x" aria-label="關閉">✕</button>
      </div>

      <!-- ── Meeting-in-use door card ── -->
      <div id="meeting-card" class="meeting-card hidden">
        <div class="meeting-card-status">
          <span class="meeting-card-dot"></span>
          MEETING IN USE &nbsp;·&nbsp; 會議使用中
        </div>
        <div class="meeting-card-reminder">溫馨提醒：看到此預約牌，請勿使用</div>
        <dl class="meeting-card-dl">
          <div class="mc-row"><dt>部門</dt><dd id="mc-dept"></dd></div>
          <div class="mc-row"><dt>日期</dt><dd id="mc-date"></dd></div>
          <div class="mc-row"><dt>時間</dt><dd id="mc-time"></dd></div>
          <div class="mc-row"><dt>區域 / 專案</dt><dd id="mc-project"></dd></div>
        </dl>
      </div>

      <!-- Standard detail DL (always shown) -->
      <dl id="detail-info" class="detail-dl"></dl>

      <!-- Cancel reason (always shown when cancel is available) -->
      <div id="cancel-reason-section" class="field">
        <label for="cancel-reason-input">取消原因 <span class="req">*</span></label>
        <input id="cancel-reason-input" type="text" maxlength="100" placeholder="請填寫取消原因">
      </div>

      <div id="cancel-pin-section" class="field hidden">
        <label for="cancel-pin-input">取消 PIN</label>
        <input id="cancel-pin-input" type="tel" maxlength="4" pattern="[0-9]{4}"
          placeholder="請輸入 4 位數 PIN" inputmode="numeric">
      </div>

      <div class="modal-actions">
        <button id="detail-close-btn" class="btn btn-ghost">關閉</button>
        <button id="detail-edit-btn"  class="btn btn-secondary">編輯</button>
        <button id="detail-cancel-btn" class="btn btn-danger">取消預約</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="config.js" onerror="window.__configMissing=true"></script>
  <script src="assets/kv.js?v=l1"></script>
  <script src="assets/app.js?v=l1"></script>
</body>
</html>
